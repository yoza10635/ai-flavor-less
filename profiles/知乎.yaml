# 知乎 profile：外部语料基线（知乎日报署名作者 5 篇，约 1.5 万汉字）
#
# 数据来源：references/external-corpus-summary.csv（按体裁分组，逐篇明细可核验）；
#           实验档案见 references/cross-genre-external-test.md。
# 阈值口径：均值 + 2σ（与 --calibrate 一致）。n=5 时该值多高于样本最大值，
#           故基本只报"超出外部语料实测范围"的极端偏离。
#
# 判读约定（全部数值阈值同此）：**实测值 > 阈值 → flag；null = 不判该项。**
# 5 篇全 0 且 σ=0 的项，均值+2σ 退化为 0，即"有即报"——这是基线本身的性质，
# 不是工具默认更严；若嫌过严，把该项改成 null 即可关闭。
#
# ⚠ 阈值不跨语料迁移（宪章 §六）：这是**外部参考基线**，回答"这篇稿在知乎语料里
#   算不算出格"，不是"AI 味判决"。要针对自己的稿子定阈，仍应 --calibrate 自己的
#   已通过稿。两套基线可并存，勿用同一阈值判两件事。
知乎:
  banlist: false        # 不加网文规范清单（违禁词/情绪直写/数据行）

  cv_thresh: 0.6717           # 章级 CV。语料 0.4653–0.6192（均值 0.5478，σ 0.0619）
  dash_thresh: 1.1747         # 破折号 次/千字。语料 0.00–0.81（5 篇中 4 篇为 0）
  de_density_thresh: 4.1413   # '的'密度 %。语料 2.597–3.748（均值 3.2172）
                              # 分母 = 逐段拼接后的长度（剔除段落间空行），
                              # 与本工具 check.py 的 `n_chars` 同口径；
                              # 换用含空白/汉字分母会整体平移，比较须同分母。

  tpl_thresh: 7.661           # 模板词对命中总数。语料 0–7（均值 1.4，σ 3.13，离散大）
  rep_ratio: 0.0232           # 重复骨架句占比。语料 0–0.0164（均值 0.0104）
  stack_thresh: 37.96         # 词性堆叠行数。语料 2–33（均值 13.6，σ 12.18）
  lowinfo_thresh: 2.39        # 信息停滞段数。语料 0–2（均值 0.6，σ 0.89）
  run_thresh: 0               # 排比簇。语料 5 篇全 0、σ=0 → 有即报
  tag_thresh: 0               # 对话标签占比。语料 5 篇全 0、σ=0 → 有即报
  mid_ratio_thresh: 0.1264    # 3-4 句段占比。语料 0–0.0992（均值 0.0363）