# 新闻 profile：外部语料基线（澎湃新闻 5 篇，约 4.8 千汉字）
#
# 数据来源、阈值口径（均值 + 2σ）与判读约定同 profiles/知乎.yaml 顶部说明。
# 用途：判"一篇稿是否偏离新闻通稿的统计形态"，不是 AI 味判决。
# ⚠ 本体裁本身高度模板化（与 AI 生成在概念边界上模糊，见
#   references/cross-genre-external-test.md 局限声明）——
#   偏离本基线**不能**解读为"更像 AI"。
新闻:
  banlist: false

  cv_thresh: 0.9100           # 章CV。语料 0.439–0.808（均值 0.6147，σ 0.1476，离散大）
  dash_thresh: 4.8454         # 破折号 次/千字。语料 0.00–4.31（5 篇中 3 篇为 0）
  de_density_thresh: 2.6455   # '的'密度 %。语料 0.258–2.156（均值 1.0746）
                              # 四体裁里最低的一档。

  tpl_thresh: 2.189           # 模板词对命中总数。语料 0–2（均值 0.4，σ 0.89）
  rep_ratio: 0.2085           # 重复骨架句占比。语料 0–0.189 —— 阈值被单篇 news1
                              # （0.189）抬高，其余 4 篇多为 0；n=5 下 σ 不稳的典型。
  stack_thresh: 23.06         # 词性堆叠行数。语料 7–20（均值 11.8，σ 5.63）
  lowinfo_thresh: 0           # 信息停滞段数。语料 5 篇全 0、σ=0 → 有即报
  run_thresh: 0               # 排比簇。语料仅 1 篇命中 1 次 → 有即报
  tag_thresh: 0               # 对话标签占比。语料 5 篇全 0、σ=0 → 有即报
  mid_ratio_thresh: 0.6434    # 3-4 句段占比。语料 0.0909–0.5（均值 0.3106，σ 0.166）