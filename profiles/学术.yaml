# 学术 profile：外部语料基线（汉斯出版社开放获取论文 5 篇，约 3 万汉字）
#
# 数据来源与阈值口径（均值 + 2σ）同 profiles/知乎.yaml 顶部说明。
#
# ⚠ 本体裁**故意关掉大半描述层阈值**，理由不是数据缺失，而是归因：
#   references/cross-genre-external-test.md 的结论 1/4 明确记载——学术体的
#   信息停滞、词性堆叠、模板命中等描述层指标大面积触发（是新闻/知乎的 3–10 倍），
#   但**学术八股在统计指纹上与 AI 味同形，按宪章 Q2 归因属体裁惯例而非 AI 味**。
#   若照搬阈值，会把正常论文成片判成 AI（false positive 生成器）。
#   因此可迁移的只有 **章级 CV**（该档案结论 3：六层中唯一无需换标定即跨体裁可比的层），
#   其余描述层留 null（不判）并保留实测值作参考带。
#
#   要判学术文本的 AI 味，正确路径是 --calibrate 自己已评审通过的论文批次，
#   并按宪章 §六重建判据方向，而不是用这批外部语料的描述层阈值。
学术:
  banlist: false

  # ---- 唯一可跨体裁迁移的判据 ----
  cv_thresh: 0.7402           # 章级 CV。语料 0.5647–0.6915（均值 0.6222，σ 0.059）

  # ---- 描述层：体裁惯例，不判 flag（保留实测值供对照）----
  # 语料实测：重复骨架簇 2–12（均值 7.4）；信息停滞 5–25（均值 13.6）；
  #           词性堆叠 36–57（均值 43.4）；模板命中 0–12（均值 6.6）
  rep_ratio: null
  tpl_thresh: null
  stack_thresh: null
  lowinfo_thresh: null

  # ---- 标点/句内：学术体很少命中，阈值留作形态参考 ----
  dash_thresh: 0              # 语料 5 篇全 0、σ=0 → 有即报
  de_density_thresh: 3.7106   # '的'密度 %。语料 1.494–3.235（均值 2.313），作参考

  run_thresh: 0               # 排比簇。语料 5 篇全 0、σ=0 → 有即报
  tag_thresh: 0.1643          # 对话标签占比。语料 0–0.1364（均值 0.0416，σ 0.061）
  mid_ratio_thresh: 0.0160    # 3-4 句段占比。语料 0.0053–0.0144（均值 0.0088）